name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python dev.py set-version ${{ github.ref_name }}

      - name: Set version from input
        if: github.event.inputs.version != ''
        run: python dev.py set-version ${{ github.event.inputs.version }}

      - name: Install pytest
        run: pip install pytest

      - name: Test standalone client packaging
        run: python -m pytest tests/test_build.py -q

      - name: Build Plugin (signed standalone release)
        run: python dev.py build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        run: ./release_notes.sh > release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          body_path: release_notes.md
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
