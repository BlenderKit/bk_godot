name: Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC - catch production/site regressions automatically.
    - cron: "0 6 * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Oldest and newest supported Godot.
        godot: ["4.4.1", "4.7.2"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
          include-templates: false

      - name: Verify Godot installation
        run: godot --version

      - name: Install pytest
        run: pip install pytest pytest-xdist

      - name: Test standalone client packaging
        run: python -m pytest tests/test_build.py -q

      - name: Build Blendkit Godot Plugin (signed standalone release)
        run: python dev.py build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: python dev.py test -v

  test-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Oldest and newest supported Godot.
        godot: ["4.4.1", "4.7.2"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false
          include-templates: false

      - name: Verify Godot installation
        run: godot --version

      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: playwright install --with-deps chromium

      - name: Install Playwright browser (macOS/Windows)
        if: runner.os != 'Linux'
        run: playwright install chromium

      - name: Test standalone client packaging
        run: python -m pytest tests/test_build.py -q

      - name: Build Blendkit Godot Plugin (signed standalone release)
        run: python dev.py build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run end-to-end tests
        run: python dev.py test-e2e -v
        env:
          BLENDERKIT_API_KEY: ${{ secrets.BLENDERKIT_API_KEY }}
          # The Client skips Windows download paths of 259+ characters, and
          # pytest's default temp folder leaves too little room for them.
          # Quoted because pytest shlex-splits this, eating Windows backslashes.
          PYTEST_ADDOPTS: "--basetemp='${{ runner.temp }}/t'"

      - name: Upload E2E diagnostic screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostic-screenshot-${{ matrix.os }}-godot-${{ matrix.godot }}
          path: tests/e2e_failure.png
          if-no-files-found: ignore
